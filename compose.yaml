services:
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 2s
      timeout: 3s
      retries: 30

  hub:
    build: .
    environment:
      DATABASE_URL: postgres://hub:hub@postgres:5432/hub?sslmode=disable
      HUB_REFLECTION: "true"
      HUB_BOT_TOKENS: example=c91cbbedf8c712e8e2b7517ddeca8fe4fde839ebd8339e0b2001363002b37712
    ports:
      - "127.0.0.1:50051:50051"
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
