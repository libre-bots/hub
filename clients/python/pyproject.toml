[project]
name = "librebots-hub"
version = "0.1.0"
description = "Client for the Libre Bots hub"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Libre Bots" }]
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.85.3",
    "protobuf>=7.35.1",
    "googleapis-common-protos",
]

[project.urls]
Source = "https://github.com/libre-bots/hub"

[dependency-groups]
dev = [
    "grpcio-tools",
    "mypy-protobuf",
    # 1.85.0.20261122 needs _typeshed.FloatInt, which the newest pyright does not ship yet
    "types-grpcio<1.85.0.20261122",
    "grpcio-status",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librebots"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["e2e: tests that need a running hub"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/librebots/hub/v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src/librebots/hub", "tests"]
exclude = ["src/librebots/hub/v1"]
extraPaths = ["src"]
