name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make lint
      - run: make test-race
      - run: make build

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make generate
      - run: git diff --exit-code
      - run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Compare the interface with the last release
        run: |
          tag="$(git for-each-ref --sort=-v:refname --format='%(refname:short)' 'refs/tags/v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "$tag" ]; then
            echo "no stable release yet, nothing to compare"
          else
            buf breaking --against ".git#tag=$tag"
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make python-lint
      - run: make python-test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: docker compose up --build --wait
      - run: make e2e
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  ci-done:
    name: CI Done
    if: always()
    needs: [go, generated, breaking, python, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
